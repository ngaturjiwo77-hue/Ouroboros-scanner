<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Ouroboros Scanner</title>
    <link rel="manifest" href="manifest.json">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#1a1a2e;color:#e0e0e0;font-family:monospace;padding:16px;min-height:100vh}
        .container{max-width:600px;margin:0 auto}
        h1{color:#6c5ce7;text-align:center;margin:20px 0;font-size:24px}
        .card{background:#16213e;border:1px solid #6c5ce7;border-radius:12px;padding:16px;margin:12px 0}
        h3{color:#a29bfe;margin-bottom:10px}
        textarea,input{width:100%;background:#0f3460;color:#e0e0e0;border:1px solid #6c5ce7;padding:10px;border-radius:8px;font-family:monospace;font-size:13px;margin:6px 0}
        textarea{height:120px}
        button{display:block;width:100%;padding:12px;margin:8px 0;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px}
        .btn-scan{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white}
        .btn-file{background:linear-gradient(135deg,#e74c3c,#c0392b);color:white}
        .result{background:#0f3460;padding:12px;border-radius:8px;margin-top:10px;font-size:11px;max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-all;display:none}
        .critical{color:#e74c3c}.high{color:#f39c12}.medium{color:#3498db}.low{color:#2ecc71}.info{color:#95a5a6}
        .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin:2px;font-weight:bold}
        .badge-CRITICAL{background:#e74c3c;color:white}
        .badge-HIGH{background:#f39c12;color:black}
        .badge-MEDIUM{background:#3498db;color:white}
        .badge-LOW{background:#2ecc71;color:white}
        .badge-INFO{background:#95a5a6;color:white}
        .tabs{display:flex;gap:4px;margin-bottom:10px}
        .tab{padding:8px 16px;background:#16213e;border:1px solid #6c5ce7;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px}
        .tab.active{background:#6c5ce7;color:white}
        #installBtn{display:none;background:#2ecc71;color:white;font-size:12px;padding:8px;margin:10px 0}
    </style>
</head>
<body>
<div class="container">
    <h1>🔮 Ouroboros Scanner</h1>
    <p style="text-align:center;color:#a29bfe;margin-bottom:10px">62,000+ Detection Rules • 17 Languages</p>
    
    <button id="installBtn" onclick="installApp()">📱 Install App</button>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('code')">🔍 Scan Code</div>
        <div class="tab" onclick="switchTab('file')">📄 Scan File</div>
    </div>

    <div class="card" id="tab-code">
        <h3>Scan Kode</h3>
        <textarea id="codeInput" placeholder="Paste kode di sini..."></textarea>
        <select id="langSelect" style="width:100%;padding:8px;background:#0f3460;color:#e0e0e0;border:1px solid #6c5ce7;border-radius:8px;margin:6px 0">
            <option value="auto">Auto Detect</option>
            <option value="python">Python</option>
            <option value="php">PHP</option>
            <option value="javascript">JavaScript</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="go">Go</option>
        </select>
        <button class="btn-scan" onclick="scanCode()">🔍 Scan Kode</button>
    </div>

    <div class="card" id="tab-file" style="display:none">
        <h3>Scan File</h3>
        <input type="file" id="fileInput" onchange="scanFile(this)" style="padding:8px">
        <p style="font-size:10px;color:#95a5a6;margin-top:4px">Support: .py .php .js .c .cpp .java .go .exe .elf .zip</p>
    </div>

    <div class="result" id="result"></div>
</div>

<script src="scanner.js"></script>
<script>
    let db = {};

    // Load rules
    fetch('rules.json')
        .then(r => r.json())
        .then(d => { db = d; console.log('Rules loaded:', Object.keys(db.rules||{}).length, 'languages'); })
        .catch(() => console.log('Rules not loaded, using built-in'));

    function switchTab(tab) {
        document.getElementById('tab-code').style.display = tab === 'code' ? 'block' : 'none';
        document.getElementById('tab-file').style.display = tab === 'file' ? 'block' : 'none';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab')[tab === 'code' ? 0 : 1].classList.add('active');
    }

    function showResult(text, color) {
        const r = document.getElementById('result');
        r.style.display = 'block';
        r.innerHTML = text;
        r.style.color = color || '#e0e0e0';
    }

    function formatResult(d) {
        let h = `<h3>📊 Scan Result</h3>`;
        h += `<p><b>Language:</b> ${d.language} | <b>Risk Score:</b> ${d.risk_score}/100</p>`;
        h += `<p>`;
        for (let [sev, count] of Object.entries(d.severity_counts||{})) {
            if (count > 0) h += `<span class="badge badge-${sev}">${sev}: ${count}</span> `;
        }
        h += `</p><hr>`;
        if (d.findings && d.findings.length > 0) {
            d.findings.forEach(f => {
                h += `<div style="margin:8px 0;padding:8px;background:#16213e;border-radius:8px">`;
                h += `<span class="badge badge-${f.severity}">${f.severity}</span> `;
                h += `<b>${f.description||f.type}</b>`;
                if (f.evidence) h += `<br><code style="font-size:10px">${f.evidence}</code>`;
                h += `</div>`;
            });
        } else {
            h += `<p style="color:#2ecc71">✅ No issues found!</p>`;
        }
        return h;
    }

    async function scanCode() {
        const code = document.getElementById('codeInput').value;
        if (!code) return alert('Masukkan kode!');
        showResult('🔄 Scanning...', '#f39c12');
        
        const lang = document.getElementById('langSelect').value;
        const findings = [];
        let risk = 0;

        // Deteksi input
        const inputs = {'$_GET':'HTTP GET','$_POST':'HTTP POST','$_REQUEST':'HTTP Request','request.args':'Flask GET','request.form':'Flask POST','input()':'User input'};
        for (let [p,d] of Object.entries(inputs)) {
            if (code.includes(p)) findings.push({type:'INPUT',severity:'MEDIUM',description:'Input: '+d,evidence:p});
        }

        // Deteksi sinks
        const sinks = {'eval(':['Code Execution','CRITICAL'],'exec(':['Code Execution','CRITICAL'],'system(':['Command Execution','CRITICAL'],'shell_exec':['Shell Execution','CRITICAL'],'pickle.loads':['Deserialization RCE','CRITICAL'],'strcpy':['Buffer Overflow','CRITICAL'],'strcat':['Buffer Overflow','CRITICAL'],'gets(':['Buffer Overflow','CRITICAL'],'sprintf':['Buffer Overflow','HIGH'],'mysql_query':['SQL Injection','HIGH']};
        for (let [p, [d,s]] of Object.entries(sinks)) {
            if (code.includes(p)) {
                findings.push({type:'SINK',severity:s,description:d+': '+p,evidence:p});
                risk += s === 'CRITICAL' ? 30 : 15;
            }
        }

        // Deteksi secrets
        if (/(?:api_key|password|secret|token)\s*=\s*['"][^'"]+['"]/i.test(code)) {
            findings.push({type:'SECRET',severity:'CRITICAL',description:'Hardcoded secret found!'});
            risk += 40;
        }

        // Cek flow
        const hasInput = findings.some(f=>f.type==='INPUT');
        const hasSink = findings.some(f=>f.type==='SINK');
        if (hasInput && hasSink && !code.toLowerCase().includes('sanitize') && !code.toLowerCase().includes('escape')) {
            findings.push({type:'FLOW',severity:'CRITICAL',description:'UNSANITIZED: Input flows to dangerous sink!'});
            risk += 50;
        }

        const result = {
            language: lang === 'auto' ? detectLang(code) : lang,
            risk_score: Math.min(risk, 100),
            severity_counts: {
                CRITICAL: findings.filter(f=>f.severity==='CRITICAL').length,
                HIGH: findings.filter(f=>f.severity==='HIGH').length,
                MEDIUM: findings.filter(f=>f.severity==='MEDIUM').length,
                LOW: findings.filter(f=>f.severity==='LOW').length,
                INFO: 0
            },
            findings: findings
        };

        showResult(formatResult(result), '#e0e0e0');
    }

    function detectLang(code) {
        if (code.includes('<?php')) return 'php';
        if (/import\s+\w+|def\s+\w+\s*\(/.test(code)) return 'python';
        if (/function\s+\w+\s*\(|const\s+\w+\s*=/.test(code)) return 'javascript';
        if (/#include/.test(code)) return 'c';
        return 'unknown';
    }

    async function scanFile(input) {
        const file = input.files[0];
        if (!file) return;
        showResult('🔄 Scanning file...', '#f39c12');
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const code = e.target.result;
            document.getElementById('codeInput').value = code;
            scanCode();
        };
        reader.readAsText(file);
    }

    // PWA Install
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBtn').style.display = 'block';
    });

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                document.getElementById('installBtn').style.display = 'none';
            });
        }
    }
</script>
</body>
</html>
